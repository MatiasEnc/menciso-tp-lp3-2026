spring.application.name=menciso-tp-lp3-2026
server.port=${PORT:8080}

# ==========================================
# Configuración de Base de Datos H2 persistente en archivo
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/armas;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración Hibernate / Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola Web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configuración de APIs Cruzadas (POO-09: Round Robin CS2)
# A1 (Propio): Matias Enciso (puerto 8080)
# A2 (Compañera 1): Diana Aquino (puerto 8081)
# A3 (Compañero 2): Fabricio Gonzalez (puerto 8082)
# ==========================================
cs2.a2.nombre=Diana Aquino
cs2.a2.base-url=${A2_BASE_URL:http://localhost:8081}
cs2.a2.endpoint=${A2_ENDPOINT:/api/armas/granadas/simular}

cs2.a3.nombre=Fabricio Gonzalez
cs2.a3.base-url=${A3_BASE_URL:http://localhost:8082}
cs2.a3.endpoint=${A3_ENDPOINT:/api/reglas/municion}
