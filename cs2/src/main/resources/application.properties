spring.application.name=menciso-tp-lp3-2026

# ==========================================
# Configuración de Base de Datos H2 persistente en archivo
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/armas;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración Hibernate / Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola Web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
